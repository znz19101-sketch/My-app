
name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Verify wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Unit tests
        run: ./gradlew testStandardDebugUnitTest --stacktrace

      - name: Lint
        run: ./gradlew lintStandardDebug --stacktrace

      - name: Assemble debug
        run: ./gradlew assembleStandardDebug --stacktrace

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: guardexa-build-reports
          path: |
            **/build/reports/**
            **/build/test-results/**
          retention-days: 14
